# =============================================================
# app.conf — definición de Mailbox para /opt/apps/_lib/run_app.sh
#
# Formato y reglas: el servidor lo tiene en /opt/apps/_lib/ESTANDAR.md.
# Acá NO se escribe lógica de deploy, solo datos. La lógica vive UNA vez en
# _lib/ y por eso una app nueva es este archivo y nada más.
#
# INSTALAR EN EL SERVIDOR (WebbApps 10.188.141.17) — dos pasos CON ROOT:
#   sudo mkdir -p /opt/apps/mailbox
#   sudo cp app.conf /opt/apps/mailbox/app.conf
#   sudo install -m 600 -o root -g root /dev/null /etc/mailbox.env
#   sudo nano /etc/mailbox.env            # credenciales (ver env.local.example)
#
# DESPUÉS, con el usuario deploy (sudo acotado, sin root extra):
#   sudo /usr/bin/bash /opt/apps/_lib/check-ports.sh mailbox
#   sudo -E /usr/bin/bash /opt/apps/_lib/run_app.sh mailbox
#   sudo /usr/bin/bash /opt/apps/_lib/verify_app.sh mailbox
#   sudo docker start mailbox             # APP_AUTO_START=0: arranque aparte
# =============================================================

# ── Identidad ────────────────────────────────────────────────────────────────
APP_NAME=mailbox

# Imagen. La construye el CI en ubuntu-latest y la sube a GHCR; el servidor solo
# hace `docker pull`, porque tiene 1 vCPU y 1.9 GB de RAM y compilar ahí no entra.
# El deploy taguea cada imagen con el SHA del commit, así que este valor es el
# "último bueno conocido" y el CI lo sobreescribe con APP_IMAGE_OVERRIDE.
APP_IMAGE=ghcr.io/hector1516/eccsa-mailbox:latest

# Secretos OBLIGATORIOS (coma, sin espacio). Si falta alguno, run_app.sh ABORTA
# antes de tocar el contenedor.
#
# Que abortar sea lo correcto: levantada sin HUB_DB_PASSWORD, la app responde
# /api/health con "ok" mientras no puede leer nada. Parecería sana y mostraría
# una bandeja vacía, que es la forma más difícil de detectar un problema.
APP_REQUIRES_ENV=HUB_DB_SERVER,HUB_DB_USER,HUB_DB_PASSWORD,HUB_DB_DATABASE

# Red propia. Mailbox habla SQL Server por TCP (10.188.141.15:1433), no por
# nombre de contenedor, así que no necesita acoplarse con ninguna otra app.
APP_NETWORKS=mailbox_net

# Puertos: host:contenedor
# 8104 es el siguiente libre del plan de puertos: 8000 y 8200 son de
# workersadmon, 8100 field, 8101 dashboard, 8103 admon.
APP_PORTS=8104:8000

# Volumen: nombre:ruta
#
# Guarda los CUERPOS de los correos (comprimidos con gzip) y las imágenes inline
# (cid:) de los mensajes. NO guarda adjuntos: se transmiten al dispositivo.
#
# OJO: este volumen es de Mailbox y NO `hubmail_data` (el del worker de HUBMail).
# Los formatos son distintos y mezclarlos dejaría dos copias divergiendo.
APP_VOLUMES=mailbox_data:/data/mailbox

# ── Política de reinicio ──────────────────────────────────────────────────────
APP_RESTART=unless-stopped

# 0 = el contenedor queda en 'created' y NO arranca.
#
# 0 y no 1 a propósito: Mailbox tiene estado (el volumen de arriba) y un push no
# debe cambiar producción por accidente. El arranque es una decisión consciente.
APP_AUTO_START=0

# Vars extra (fuera del prefijo HUB_).
#
# VAPID_PRIVATE_KEY / VAPID_PUBLIC_KEY son OPCIONALES: si no están, el backend
# genera el par EC P-256 y lo guarda en HUB_Config, igual que Field y Admon. Se
# declaran aquí solo si se quiere la llave fuera de la base.
APP_EXTRA_ENV=TZ